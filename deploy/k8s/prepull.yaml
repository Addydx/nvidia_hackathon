# Descarga la imagen nueva de Next.js en el nodo ANTES de la ventana de cambio, para que el
# rollout posterior no espere al pull. Se aplica y se borra sola con prepull.sh.
apiVersion: v1
kind: Pod
metadata: { name: prepull-web, namespace: hackathon, labels: { app: prepull } }
spec:
  restartPolicy: Never
  automountServiceAccountToken: false
  imagePullSecrets: [{ name: ghcr-pull }]
  securityContext: { runAsNonRoot: true, runAsUser: 1000, runAsGroup: 1000, seccompProfile: { type: RuntimeDefault } }
  containers:
    - name: web
      image: ghcr.io/addydx/nvidia-hackathon-web:${WEB_TAG}
      command: ["node", "-e", "process.exit(0)"]
      resources: { requests: { cpu: 10m, memory: 16Mi }, limits: { cpu: 100m, memory: 128Mi } }
      securityContext: { allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: { drop: [ALL] } }
