# Corte de caja · namespace exclusivo "hackathon". No toca otros namespaces (AlePay, addydx).
# Aplicar:  export WEB_TAG=sha-<commit> VISION_TAG=sha-<commit>;
#           envsubst '$WEB_TAG $VISION_TAG' < deploy/k8s/hackathon.yaml | kubectl apply -f -
# El namespace lo crea deploy/admin-setup.sh. Requiere antes (ver deploy/README.md): Secret "hackathon-env" y Secret "ghcr-pull" en el namespace.
# Python: solo recibe tráfico de Next.js. Modelo en solo lectura desde el host.
apiVersion: apps/v1
kind: Deployment
metadata: { name: vision, namespace: hackathon, labels: { app: vision } }
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector: { matchLabels: { app: vision } }
  template:
    metadata: { labels: { app: vision } }
    spec:
      automountServiceAccountToken: false
      imagePullSecrets: [{ name: ghcr-pull }]
      securityContext: { runAsNonRoot: true, runAsUser: 10001, runAsGroup: 10001, seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: vision
          image: ghcr.io/addydx/nvidia-hackathon-vision:${VISION_TAG}
          ports: [{ name: http, containerPort: 8000 }]
          env:
            - { name: MODEL_PATH, value: /models/monedad.onnx }
            - { name: VISION_DEVICE, value: cpu }
          readinessProbe:
            httpGet: { path: /salud, port: http }
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
          resources:
            requests: { cpu: 250m, memory: 768Mi }
            limits: { cpu: "2", memory: 2Gi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          volumeMounts:
            - { name: models, mountPath: /models, readOnly: true }
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: models
          hostPath: { path: /home/addyx/hackathon/models, type: Directory }
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata: { name: vision, namespace: hackathon }
spec:
  selector: { app: vision }
  ports: [{ name: http, port: 8000, targetPort: http }]
---
# Next.js: habla con Python por la red interna y con el Supabase del hackathon.
apiVersion: apps/v1
kind: Deployment
metadata: { name: web, namespace: hackathon, labels: { app: web } }
spec:
  replicas: 1
  strategy: { type: RollingUpdate, rollingUpdate: { maxUnavailable: 0, maxSurge: 1 } }
  selector: { matchLabels: { app: web } }
  template:
    metadata: { labels: { app: web } }
    spec:
      automountServiceAccountToken: false
      imagePullSecrets: [{ name: ghcr-pull }]
      securityContext: { runAsNonRoot: true, runAsUser: 1000, runAsGroup: 1000, seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: web
          image: ghcr.io/addydx/nvidia-hackathon-web:${WEB_TAG}
          ports: [{ name: http, containerPort: 3000 }]
          env:
            - { name: VISION_API_URL, value: "http://vision:8000" }
            - { name: APP_URL, value: "https://nvidia.addydx.com" } # enlaces de los correos de Auth
          envFrom:
            - secretRef: { name: hackathon-env } # SUPABASE_URL, SUPABASE_SERVICE_ROLE_KEY, SUPABASE_ANON_KEY
          readinessProbe:
            httpGet: { path: /cierre, port: http }
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests: { cpu: 100m, memory: 192Mi }
            limits: { cpu: "1", memory: 512Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
            - { name: next-cache, mountPath: /app/.next/cache }
      volumes:
        - name: tmp
          emptyDir: {}
        - name: next-cache
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata: { name: web, namespace: hackathon }
spec:
  selector: { app: web }
  ports: [{ name: http, port: 80, targetPort: http }]
---
# Solo Next.js se publica (Traefik, mismo patrón que addydx). Cloudflare Tunnel apunta a Traefik
# y Cloudflare Access protege el hostname: ver deploy/README.md.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: web
  namespace: hackathon
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
spec:
  ingressClassName: traefik
  rules:
    - host: nvidia.addydx.com
      http:
        paths:
          - { path: /, pathType: Prefix, backend: { service: { name: web, port: { number: 80 } } } }
---
# Python solo acepta conexiones desde los pods de Next.js del mismo namespace.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: vision-solo-web, namespace: hackathon }
spec:
  podSelector: { matchLabels: { app: vision } }
  policyTypes: [Ingress]
  ingress:
    - from: [{ podSelector: { matchLabels: { app: web } } }]
      ports: [{ port: 8000 }]
